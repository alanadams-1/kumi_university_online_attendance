<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c2f6b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Attendance">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance Live Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#14213d;--muted:#5b6478;--line:#d5dbe6;--accent:#2446d8;--accent-ink:#fff;--navy:#1c2f6b;--ok:#1f8a5b;--bad:#c23b3b;--f:#d6457f;--m:#2446d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--surface:#18203a;--ink:#e8ecf7;--muted:#9aa5c0;--line:#2b3555;--accent:#6c8cff;--accent-ink:#0f1524;--navy:#24378a;--ok:#4cc38a;--bad:#ff7b7b;--f:#ff7aa8;--m:#6c8cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1524;--surface:#18203a;--ink:#e8ecf7;--muted:#9aa5c0;--line:#2b3555;--accent:#6c8cff;--accent-ink:#0f1524;--navy:#24378a;--ok:#4cc38a;--bad:#ff7b7b;--f:#ff7aa8;--m:#6c8cff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header h1{margin:0;font-size:1.5rem;font-weight:800}
header small{display:block;opacity:.8;font-weight:400}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input[type=password]{font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.home{color:#fff;text-decoration:none;font-weight:600;padding:8px 12px;border:1px solid rgba(255,255,255,.45);border-radius:10px}
.live{display:flex;align-items:center;gap:7px;font-weight:600;font-size:.9rem}
.dot{width:10px;height:10px;border-radius:50%;background:#9aa5c0}
.dot.ok{background:#4cc38a;animation:pulse 2s infinite}.dot.err{background:#ff7b7b}
@keyframes pulse{50%{opacity:.35}}
main{max-width:1200px;margin:0 auto;padding:18px;display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{margin:0 0 12px;font-size:1rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.total{grid-column:span 4;display:flex;flex-direction:column;justify-content:center}
.big{font-size:clamp(4.5rem,12vw,8rem);font-weight:800;line-height:1;color:var(--accent)}
.sex{grid-column:span 8}
.courses{grid-column:span 5}
.feed{grid-column:span 7}
@media (max-width:820px){.total,.sex,.courses,.feed{grid-column:span 12}}
.bar{margin:10px 0}
.bar .lab{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.track{height:16px;border-radius:99px;background:var(--bg);overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .6s ease;background:var(--accent)}
.fill.f{background:var(--f)}.fill.m{background:var(--m)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li.new{animation:flash 2.5s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--ok) 30%,transparent)}to{background:transparent}}
.who{font-weight:600}.sub{color:var(--muted);font-size:.9rem}
.time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--muted);padding:10px 0}
label.chk{display:flex;align-items:center;gap:6px;font-size:.9rem}
.login{max-width:380px;margin:12vh auto;padding:0 18px;text-align:center}
.login .card{display:grid;gap:12px}
button{font:inherit;font-weight:600;padding:11px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lerr{color:var(--bad);min-height:1.2em;margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <div class="card">
    <h1 style="margin:0">Attendance dashboard</h1>
    <p class="sub" style="margin:0">Enter the lecturer PIN to view live attendance.</p>
    <input type="password" id="pin" aria-label="Lecturer PIN" autocomplete="off" placeholder="Lecturer PIN">
    <button id="go">Open dashboard</button>
    <p class="lerr" id="loginErr" role="alert"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div><h1>Attendance live</h1><small>Students appear here the moment they are scanned</small></div>
    <div class="ctl">
      <a class="home" href="index.html">Home</a>
      <select id="session" aria-label="Session"></select>
      <label class="chk"><input type="checkbox" id="names" checked> Show names</label>
      <div class="live"><span class="dot" id="dot"></span><span id="status">Connecting...</span></div>
    </div>
  </header>
  <main>
    <section class="card total"><h2>Present</h2><div class="big" id="total">0</div><div class="sub" id="sessionName"></div></section>
    <section class="card sex"><h2>Male and female</h2><div id="sexBars"></div></section>
    <section class="card courses"><h2>By course</h2><div id="courseBars"></div></section>
    <section class="card feed"><h2>Latest scans</h2><ul class="list" id="feed"></ul></section>
  </main>
</div>

<script>
(function(){
  var URL_="https://script.google.com/macros/s/AKfycbwVmQ2voet8j7jjXVl2AgxOZNVTFXok4mBpduFmMYP07ImY9Qgz9r6-oDrttb9GMyKe/exec";
  var PIN_KEY="dash:pin";
  var $=function(id){return document.getElementById(id)};
  var pin="",records=[],seen={},first=true,timer=null;
  try{pin=localStorage.getItem(PIN_KEY)||"";if(!pin){pin=(JSON.parse(localStorage.getItem("attendance:cfg")||"{}").pin)||""}}catch(e){}

  function key(r){return String(r.session).toLowerCase()+"|"+String(r.reg).toLowerCase()}
  function tm(ts){return new Date(ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
  function status(txt,cls){$("status").textContent=txt;$("dot").className="dot "+(cls||"")}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

  function bar(label,n,total,cls){
    var w=el("div","bar"),l=el("div","lab"),t=el("div","track"),f=el("div","fill "+(cls||""));
    l.appendChild(el("span","",label));
    l.appendChild(el("span","",n+(total?" ("+Math.round(n*100/total)+"%)":"")));
    f.style.width=(total?Math.round(n*100/total):0)+"%";
    t.appendChild(f);w.appendChild(l);w.appendChild(t);return w;
  }

  function fillSessions(){
    var sel=$("session"),cur=sel.value||"__all";
    var names=[];records.forEach(function(r){var s=String(r.session||"");if(s&&names.indexOf(s)<0)names.push(s)});
    sel.innerHTML="";
    var a=el("option","","All sessions");a.value="__all";sel.appendChild(a);
    names.forEach(function(n){var o=el("option","",n);o.value=n;sel.appendChild(o)});
    sel.value=names.indexOf(cur)>=0||cur==="__all"?cur:"__all";
  }

  function render(){
    var sel=$("session").value||"__all";
    var rows=records.filter(function(r){return sel==="__all"||String(r.session)===sel});
    rows.sort(function(a,b){return b.ts-a.ts});
    var total=rows.length,male=0,female=0,courses={};
    rows.forEach(function(r){
      var s=String(r.sex||"");
      if(/^m/i.test(s))male++;else if(/^f/i.test(s))female++;
      var c=String(r.course||"Not stated");courses[c]=(courses[c]||0)+1;
    });
    $("total").textContent=total;
    $("sessionName").textContent=sel==="__all"?"All sessions":sel;
    var sb=$("sexBars");sb.innerHTML="";
    sb.appendChild(bar("Female",female,total,"f"));sb.appendChild(bar("Male",male,total,"m"));
    var cb=$("courseBars");cb.innerHTML="";
    var ck=Object.keys(courses).sort(function(a,b){return courses[b]-courses[a]});
    if(!ck.length)cb.appendChild(el("div","empty","No scans yet."));
    ck.slice(0,6).forEach(function(c){cb.appendChild(bar(c,courses[c],total))});
    var feed=$("feed");feed.innerHTML="";
    if(!rows.length){var li=el("li","empty","Waiting for the first scan...");feed.appendChild(li)}
    var showNames=$("names").checked;
    rows.slice(0,10).forEach(function(r){
      var li=el("li",!first&&!seen[key(r)]?"new":"");
      var left=el("div");
      left.appendChild(el("div","who",showNames?(r.name||r.reg):String(r.reg)));
      left.appendChild(el("div","sub",(showNames?r.reg+", ":"")+(r.course||"")));
      li.appendChild(left);li.appendChild(el("div","time",tm(r.ts)));
      feed.appendChild(li);
    });
    rows.forEach(function(r){seen[key(r)]=true});
    first=false;
  }

  async function poll(){
    try{
      var r=await fetch(URL_+"?action=list&pin="+encodeURIComponent(pin));
      var j=await r.json();
      if(j&&j.error==="bad_pin"){showLogin("Wrong PIN. Try again.");return}
      records=(j&&j.records)||[];
      fillSessions();render();
      status("Live, updated "+tm(Date.now()),"ok");
    }catch(e){status("Offline, retrying...","err")}
  }

  function showLogin(msg){
    clearInterval(timer);timer=null;
    $("app").hidden=true;$("login").hidden=false;$("loginErr").textContent=msg||"";
    try{localStorage.removeItem(PIN_KEY)}catch(e){}
  }
  function start(){
    $("login").hidden=true;$("app").hidden=false;
    first=true;seen={};
    poll();if(!timer)timer=setInterval(poll,5000);
  }
  $("go").onclick=function(){
    var v=$("pin").value.trim();
    if(!v){$("loginErr").textContent="Enter the PIN.";return}
    pin=v;try{localStorage.setItem(PIN_KEY,pin)}catch(e){}
    start();
  };
  $("pin").onkeydown=function(e){if(e.key==="Enter")$("go").click()};
  $("session").onchange=render;$("names").onchange=render;
  if(pin){start()}else{showLogin("")}
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
